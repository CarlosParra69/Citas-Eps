<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - MediApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            border: 1px solid #E1E8ED;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
        }

        .logo h1 {
            color: #FF6B35;
            margin: 0;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo p {
            color: #8E8E93;
            margin: 8px 0 0 0;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #14171A;
            font-weight: 600;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #C6C6C8;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: #F9F9F9;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B35;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group input:invalid {
            border-color: #FF3B30;
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn:hover:not(:disabled) {
            background: #FF8C42;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn:disabled {
            background: #AAB8C2;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            border-left: 4px solid;
        }

        .alert-error {
            background: #FFF5F5;
            color: #C53030;
            border-left-color: #E53E3E;
        }

        .alert-success {
            background: #F0FFF4;
            color: #22543D;
            border-left-color: #38A169;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }

        .back-link a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #FF8C42;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF6B35;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="/MediApp_logo.png" alt="MediApp Logo" onerror="this.style.display='none'">
            <h1>MediApp</h1>
            <p>Nueva Contraseña</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">Nueva Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6"
                    placeholder="Ingresa tu nueva contraseña">
            </div>

            <div class="form-group">
                <label for="password_confirmation">Confirmar Contraseña:</label>
                <input type="password" id="password_confirmation" name="password_confirmation" required minlength="6"
                    placeholder="Confirma tu nueva contraseña">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Actualizar Contraseña
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Procesando...</p>
            </div>
        </form>

        <div class="back-link">
            <a href="/" onclick="window.close()">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        // Verificar que tenemos token y email
        if (!token || !email) {
            showAlert('Enlace inválido o parámetros faltantes. Solicita un nuevo enlace de recuperación.', 'error');
            document.getElementById('submitBtn').disabled = true;
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';
        }

        // Manejar el envío del formulario
        document.getElementById('resetForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlert();

            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('password_confirmation').value;

            // Validación básica
            if (password.length < 6) {
                showAlert('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            if (password !== passwordConfirmation) {
                showAlert('Las contraseñas no coinciden.', 'error');
                return;
            }

            if (!token || !email) {
                showAlert('Token o email faltante.', 'error');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        token: token,
                        password: password,
                        password_confirmation: passwordConfirmation
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('¡Contraseña actualizada exitosamente! Ya puedes iniciar sesión con tu nueva contraseña.', 'success');

                    // Deshabilitar el formulario
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('password').disabled = true;
                    document.getElementById('password_confirmation').disabled = true;
                } else {
                    showAlert(data.message || 'Error al actualizar la contraseña.', 'error');
                    hideLoading();
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión. Verifica tu conexión a internet e intenta de nuevo.', 'error');
                hideLoading();
            }
        });
    </script>
</body>

</html>
